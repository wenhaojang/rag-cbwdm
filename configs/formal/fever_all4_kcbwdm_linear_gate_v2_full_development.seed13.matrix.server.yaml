    server_config: /root/experiments/rag_cbwdm/formal_v2_deployment/configs/fever_qwen7_full_development.server.yaml

  - generator_id: mistral-7b-instruct-v0.3
    model_family: mistral
    config: /root/experiments/rag_cbwdm/formal_v2_deployment/configs/fever_mistral7_full_development.server.yaml
    server_config: /root/experiments/rag_cbwdm/formal_v2_deployment/configs/fever_mistral7_full_development.server.yaml

methods:
  - kcbwdm_linear_gate_v2

learned_seeds: [13]

kcbwdm_linear_gate_v2:
  contract_version: kcbwdm_linear_gate_v2.v1
  method: kcbwdm_linear_gate_v2

  teacher:
    top_m: 4
    stop_threshold: 0.001
    alignment_eps: 0.0
    b_plus: 0.01
    b_minus: 0.001
    neutral_sample_policy: negative
    gain_tolerance: 1.0e-10

  kernel:
    base_kernel: rbf
    anchor: zero_effect
    bandwidth_policy: train_core_within_query_positive_distance_median
    ridge_lambda: 0.01
    lambda_policy: absolute
    target_normalization: false
    set_dependent_centering: false

  sign_policy: static_linear_target_alignment_gt_0

  selector:
    top_m: 4
    min_docs: 0
    score_threshold: 0.0

  seed: 13
