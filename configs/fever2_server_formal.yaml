dataset: fever2
profile: server_formal
profile_limits:
  train: null
  dev: null
  seeds: [13, 21, 42]
paths:
  raw_fever_train: data/raw/fever/train.jsonl
  raw_fever_dev: data/raw/fever/dev.jsonl
  raw_fever_test: data/raw/fever/shared_task_test.jsonl
  raw_wiki_pages_dir: data/raw/fever/wiki-pages
  processed_dir: outputs/processed
task:
  labels: [SUPPORTS, REFUTES]
  verbalizers:
    SUPPORTS: [A, " A", "\nA"]
    REFUTES: [B, " B", "\nB"]
  label_map: {SUPPORTS: SUPPORTS, REFUTES: REFUTES}
  drop_labels: ["NOT ENOUGH INFO"]
corpus: {mode: sentence, include_title: true, min_text_chars: 5}
retrieval: {method: bm25, top_n: 20}
generator:
  model_name: Qwen/Qwen2.5-7B-Instruct
  revision: null
  dtype: auto
  device_map: auto
  trust_remote_code: false
  max_context_tokens: 4096
  posterior_batch_size: 16
cbwdm:
  L_type: euclidean_posterior_shift
  ridge_lambda: 0.01
  top_m: 4
  stop_threshold: 0.0
  eps_smooth: 0.001
  target_smoothing: paper_mixture
  gain_tolerance: 1.0e-10
  store_all_gains: true
selector:
  model_type: state_aware_cross_encoder
  model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  revision: null
  loss_type: cbwdm_multitask
  parameter_status: provisional_must_be_frozen_after_train_dev_pilot
  b_plus: 0.01
  b_minus: 0.001
  gamma: 1.0
  beta: 0.5
  neutral_sample_policy: negative
  epochs: 5
  batch_size: 8
  candidate_batch_size: 32
  lr: 2.0e-5
  max_length: 512
  top_m: 4
  min_docs: 1
  score_threshold: null
