dataset: fever2
profile: server_pilot_5000_500
seed: 13
profile_limits:
  train_core: 5000
  validation: 500
  held_out_test: null
  corpus: null
  seeds: [13]
formal_splits:
  enabled: true
  seed: 13
  validation_size: 5000
  output_dir: outputs/formal_splits/fever2_seed13
  official_train: data/raw/fever/train.jsonl
  official_dev: data/raw/fever/dev.jsonl
paths:
  raw_fever_train: data/raw/fever/train.jsonl
  raw_fever_dev: data/raw/fever/dev.jsonl
  raw_wiki_pages_dir: data/raw/fever/wiki-pages
  processed_dir: outputs/processed
task:
  labels: [SUPPORTS, REFUTES]
  verbalizers:
    SUPPORTS: [A, " A", "\nA"]
    REFUTES: [B, " B", "\nB"]
  label_map: {SUPPORTS: SUPPORTS, REFUTES: REFUTES}
  drop_labels: ["NOT ENOUGH INFO"]
corpus: {mode: sentence, include_title: true, min_text_chars: 5}
retrieval:
  method: bm25
  backend: pyserini_lucene
  top_n: 20
  bm25: {k1: 0.9, b: 0.4}
  index: {path: null, analyzer: english, store_raw: true}
generator:
  model_name: Qwen/Qwen2.5-1.5B-Instruct
  revision: null
  dtype: auto
  device_map: auto
  trust_remote_code: false
  max_context_tokens: 4096
  posterior_batch_size: 16
cbwdm:
  L_type: euclidean_posterior_shift
  ridge_lambda: 0.01
  top_m: 4
  stop_threshold: 0.0
  eps_smooth: 0.001
  target_smoothing: paper_mixture
  gain_tolerance: 1.0e-10
  store_all_gains: true
selector:
  model_type: state_aware_cross_encoder
  model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  revision: null
  loss_type: cbwdm_multitask
  parameter_status: validation_calibration_required
  b_plus: 0.01
  b_minus: 0.001
  gamma: 1.0
  beta: 0.5
  neutral_sample_policy: negative
  epochs: 3
  batch_size: 8
  candidate_batch_size: 32
  lr: 2.0e-5
  max_length: 512
  top_m: 4
  min_docs: 1
  score_threshold: null
baselines:
  common: {top_m: 4, min_docs: 2}
  naive: {enabled: true, min_docs: 4}
  bge:
    enabled: true
    model_name: BAAI/bge-reranker-large
    revision: null
    dtype: auto
    batch_size: 8
    max_length: 512
    threshold: null
    min_docs: 4
    normalize_score: false
    local_files_only: true
  infogain_fever:
    enabled: true
    model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
    revision: null
    beta: 0.75
    rank_loss: pairwise_logistic
    threshold_mode: train_quantile
    positive_quantile: 0.75
    negative_quantile: 0.25
    inference_threshold: null
    min_docs: 2
    top_m: 4
    epochs: 3
    lr: 2.0e-5
    max_length: 512
    candidate_batch_size: 32
  oracle: {enabled: true, diagnostic_only: true}
calibration:
  objective: macro_f1
  infogain:
    teacher_quantiles:
      - [0.20, 0.80]
      - [0.25, 0.75]
      - [0.30, 0.70]
    filter_thresholds: [0.3, 0.5, 0.7]
    min_docs: [1, 2]
    top_m: [4]
    beta: [0.5, 0.75]
  cbwdm:
    stop_thresholds: [0.0, 0.001, 0.01]
    score_thresholds: [null, 0.0]
    min_docs: [1, 2]
    top_m: [4]
    beta: [0.25, 0.5, 0.75]
    gamma: [0.5, 1.0]
    b_plus: [0.01]
    b_minus: [0.001]
diagnostics:
  min_pilot_examples: 500
  oracle_naive_tolerance: 0.02
