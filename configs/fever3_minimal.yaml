dataset: fever3

paths:
  raw_fever_train: data/raw/fever/train.jsonl
  raw_fever_dev: data/raw/fever/dev.jsonl
  raw_fever_test: data/raw/fever/shared_task_test.jsonl
  raw_wiki_pages_dir: data/raw/fever/wiki-pages
  processed_dir: outputs/processed

task:
  labels:
    - SUPPORTS
    - REFUTES
    - NOT_ENOUGH_INFO
  verbalizers:
    SUPPORTS:
      - A
      - " A"
      - "\nA"
    REFUTES:
      - B
      - " B"
      - "\nB"
    NOT_ENOUGH_INFO:
      - C
      - " C"
      - "\nC"
  label_map:
    SUPPORTS: SUPPORTS
    REFUTES: REFUTES
    NOT ENOUGH INFO: NOT_ENOUGH_INFO
  drop_labels: []

corpus:
  mode: sentence
  include_title: true
  min_text_chars: 5

retrieval:
  method: bm25
  top_n: 20

generator:
  model_name: Qwen/Qwen2.5-7B-Instruct
  dtype: auto
  device_map: auto
  trust_remote_code: true
  max_context_tokens: 4096

cbwdm:
  L_type: identity
  ridge_lambda: 0.01
  top_m: 4
  stop_threshold: 0.0
  eps_smooth: 0.001
  store_all_gains: true

selector:
  model_type: feature_mlp
  hidden_dim: 128
  dropout: 0.1
  epochs: 5
  batch_size: 64
  lr: 0.0001
  top_m: 4
  min_docs: 1
  score_threshold: null
